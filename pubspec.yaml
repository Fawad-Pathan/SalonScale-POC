name: salonscale_poc
description: A functional Flutter proof of concept for salon backbar inventory scanning.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.0
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  camera: ^0.12.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/products.json
    - assets/images/
